name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'zad_alqolob_1_code/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p zad_alqolob_1_code/android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zad-alqolob-debug-apk
          path: zad_alqolob_1_code/android/app/build/outputs/apk/debug/app-debug.apk
